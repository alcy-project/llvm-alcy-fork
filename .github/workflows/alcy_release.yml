name: Build and Release LLVM Binaries

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    branches: ["alcy/*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to upload"
        required: true
        default: 'v0.0.1'
      overwrite:
        description: "Overwrite existing files"
        type: boolean
        default: true

jobs:
  build:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install Ninja
        uses: llvm/actions/install-ninja@main

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="X86;ARM;AArch64" \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF

      - name: Build and Install
        run: |
          cmake --build build --target install

      - name: Archive Binaries
        shell: bash
        run: |
          tar -czf "llvm-${{ matrix.triple }}.tar.gz" -C ./install .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: llvm-${{ matrix.triple }}.tar.gz
          append_body: true
          overwrite: ${{ github.event.inputs.overwrite || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
