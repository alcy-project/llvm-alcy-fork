name: Build and Release LLVM Binaries

permissions:
  contents: write

on:
  push:
    tags:
      - 'alcy_*'
env:
  build_dir: "./.alcy/build"
  install_dir: "./.alcy/install"

jobs:
  build:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install Ninja
        uses: llvm/actions/install-ninja@main

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-llvm-ccache
          max-size: 2G

      - name: Configure CMake
        run: |
          ./.alcy/configure.sh $build_dir $install_dir Release Ninja ccache

      - name: Build and Install
        run: |
          ccache -z
          cmake --build $build_dir --target install
          ccache -s

      - name: Archive Binaries
        run: |
          basename="llvm-${{ matrix.triple }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a $basename.zip $install_dir/*
          else
            tar -czf $basename.tar.gz -C $install_dir .
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "llvm-${{ matrix.triple }}.*"
          draft: true
          append_body: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
