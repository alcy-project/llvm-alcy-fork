name: Build and Upload LLVM Binaries

permissions:
  contents: write

on:
  push:
    branches: [ "alcy/*" ]
    tags:
      - 'alcy-*'
  pull_request:
    branches: [ "alcy/*" ]

env:
  build_dir: "./.alcy/build"
  install_dir: "./.alcy/install"

jobs:
  build:
    name: Build and Release (${{ matrix.build_type }}-${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        cc: [clang]
        cxx: [clang++]
        triple:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - riscv64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - wasm32-unknown-emscripten
        exclude:
          # The wasm build uses emcc/em++ (see include row below), not clang.
          - triple: wasm32-unknown-emscripten
            cc: clang
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
            container: ""
            libcxx: true
            warning: true
            ccache: true
            extra_args: ""
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            container: alpine:latest
            libcxx: false
            warning: true
            ccache: true
            extra_args: ""
          - triple: riscv64-unknown-linux-gnu
            os: ubuntu-26.04
            container: ""
            libcxx: true
            warning: true
            ccache: true
            extra_args: ""
          - triple: aarch64-apple-darwin
            os: macos-26
            container: ""
            libcxx: true
            warning: true
            ccache: true
            extra_args: ""
          - triple: x86_64-apple-darwin
            os: macos-26
            container: ""
            libcxx: true
            warning: true
            ccache: true
            extra_args: ""
          - triple: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            container: ""
            libcxx: false
            warning: false
            ccache: false
            extra_args: ""
          # WebAssembly build for the alcy compiler playground. Uses
          # Emscripten (see Setup Emscripten step); extra_args override the
          # native-oriented defaults in .alcy/configure.sh (cmake keeps the
          # last -D value). Only the WebAssembly target is built.
          # NOTE: LLVM_USE_HOST_TOOLS builds tablegen with the host compiler
          # so no target-built .js is ever executed during the build, and
          # LLVM_EXTERNALIZE_DEBUGINFO must stay OFF because GNU objcopy
          # cannot process em++ outputs (.js).
          - triple: wasm32-unknown-emscripten
            build_type: debug
            os: ubuntu-26.04
            container: ""
            cc: emcc
            cxx: em++
            libcxx: false
            warning: true
            ccache: false
            extra_args: "-DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake -DLLVM_TARGETS_TO_BUILD=WebAssembly -DLLVM_ENABLE_THREADS=OFF -DLLVM_ENABLE_BACKTRACES=OFF -DLLVM_ENABLE_CRASH_OVERRIDES=OFF -DLLVM_ENABLE_UNWIND_TABLES=OFF -DLLVM_ENABLE_PIC=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_USE_SPLIT_DWARF=OFF -DLLVM_ABI_BREAKING_CHECKS=FORCE_OFF -DLLVM_USE_HOST_TOOLS=ON -DLLVM_EXTERNALIZE_DEBUGINFO=OFF"
          - triple: wasm32-unknown-emscripten
            build_type: release
            os: ubuntu-26.04
            container: ""
            cc: emcc
            cxx: em++
            libcxx: false
            warning: true
            ccache: false
            extra_args: "-DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake -DLLVM_TARGETS_TO_BUILD=WebAssembly -DLLVM_ENABLE_THREADS=OFF -DLLVM_ENABLE_BACKTRACES=OFF -DLLVM_ENABLE_CRASH_OVERRIDES=OFF -DLLVM_ENABLE_UNWIND_TABLES=OFF -DLLVM_ENABLE_PIC=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_USE_SPLIT_DWARF=OFF -DLLVM_ABI_BREAKING_CHECKS=FORCE_OFF -DLLVM_USE_HOST_TOOLS=ON -DLLVM_EXTERNALIZE_DEBUGINFO=OFF"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install dependencies (Alpine / Musl)
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        shell: sh
        run: |
          apk update
          apk add --no-cache \
            bash \
            cmake \
            ninja \
            clang \
            lld \
            build-base \
            ccache \
            zstd \
            tar \
            git \
            7zip \
            python3

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux' && matrix.triple != 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev clang

      - name: Install Ninja
        if: matrix.triple != 'x86_64-unknown-linux-musl'
        uses: llvm/actions/install-ninja@89a8cf80982d830faab019237860b344a6390c30

      - name: Setup Emscripten
        if: matrix.triple == 'wasm32-unknown-emscripten'
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@4d0316e3a1f3f3c1a7a424368dc64f860c345402
        with:
          key: ${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.triple }}-${{ matrix.cc }}-llvm-ccache
          max-size: 4G
          job-summary: ""

      - name: Setup mold
        if: runner.os == 'Linux' && matrix.triple != 'x86_64-unknown-linux-musl' && matrix.triple != 'wasm32-unknown-emscripten'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
        with:
          # Use latest
          # mold-version: 2.42.0
          make-default: true

      - name: Cache CMake build directory
        if: runner.os != 'macOS' || matrix.build_type != 'debug'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.build_dir }}
          key: cmake-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.triple }}-${{ github.sha }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.triple }}-

      - name: Verify WASM prerequisites
        if: matrix.triple == 'wasm32-unknown-emscripten'
        run: |
          command -v emcc || { echo "::error::emcc not found on PATH"; exit 1; }
          emcc -v
          if ! command -v ninja; then
            echo "ninja not found; installing via apt"
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          fi
          test -f "$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" || {
            echo "::error::Emscripten toolchain file not found under EMSDK=$EMSDK. The emsdk install may have failed."
            exit 1
          }

      - name: Configure CMake
        run: |
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            # actual_build_type="RelWithDebInfo"
            actual_build_type="Debug"
            assertions="ON"
          else
            actual_build_type="Release"
            assertions="OFF"
          fi

          # NOTE: ${{ matrix.extra_args }} must stay UNQUOTED below so that
          # multi-flag values undergo word splitting. Quoted, the flags
          # arrive as a single shell word and cmake receives one broken -D
          # argument (e.g. toolchain path with trailing flags appended).
          ./.alcy/configure.sh \
            ./llvm \
            "$build_dir" \
            "$install_dir" \
            "$actual_build_type" \
            "$assertions" \
            "${{ matrix.triple }}" \
            "${{ matrix.libcxx }}" \
            "${{ matrix.warning }}" \
            Ninja \
            "${{ matrix.ccache }}" \
            "${{ matrix.cc }}" \
            "${{ matrix.cxx }}" \
            ${{ matrix.extra_args }}

      - name: Build and Install
        run: |
          ccache -z
          # cmake --build $build_dir --target install --parallel 2
          ninja -C $build_dir install
          ccache -s -v

      - name: Archive Binaries
        run: |
          basename="llvm-${{ matrix.build_type }}-${{ matrix.triple }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a ${basename}.zip ${install_dir}/*
            echo "ARCHIVE_FILE=${basename}.zip" >> $GITHUB_ENV
          else
            # tar -czf ${basename}.tar.gz -C ${install_dir} .
            # echo "ARCHIVE_FILE=${basename}.tar.gz" >> $GITHUB_ENV
            tar --use-compress-program="zstd -T0 -19" -cf ${basename}.tar.zst -C ${install_dir} .
            echo "ARCHIVE_FILE=${basename}.tar.zst" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llvm-${{ matrix.build_type }}-${{ matrix.triple }}
          path: ${{ env.ARCHIVE_FILE }}
          retention-days: 7
          compression-level: 0

      - name: Upload to Release
        if: github.ref_type == 'tag' && !env.ACT
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ARCHIVE_FILE }}
          draft: true
          append_body: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
